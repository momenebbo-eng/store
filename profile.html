<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملفي الشخصي - متجري</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f0c29;
      --gold: #f5a623;
      --gold-light: #ffd966;
      --white: #ffffff;
      --glass: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--primary);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(245,166,35,0.13) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 70%, rgba(36,36,62,0.8) 0%, transparent 50%),
        linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      z-index: -2;
    }

    body::after {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(245,166,35,0.08) 1px, transparent 1px);
      background-size: 40px 40px; z-index: -1;
      animation: bgMove 20s linear infinite;
    }

    @keyframes bgMove { 0% { background-position: 0 0; } 100% { background-position: 40px 40px; } }

    /* Glow */
    .glow-orb {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(245,166,35,0.09) 0%, transparent 65%);
      border-radius: 50%; pointer-events: none;
      animation: pulse 5s ease-in-out infinite; z-index: -1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    /* Card */
    .profile-card {
      width: 100%; max-width: 460px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 50px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: cardIn 0.7s cubic-bezier(.22,1,.36,1) both;
      margin: 20px;
      text-align: center;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Avatar */
    .avatar-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar-circle {
      width: 100px; height: 100px;
      background: linear-gradient(135deg, rgba(245,166,35,0.2), rgba(255,217,102,0.1));
      border: 2px solid rgba(245,166,35,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem;
      color: var(--gold);
      margin: 0 auto;
    }

    .avatar-status {
      position: absolute;
      bottom: 4px; left: 4px;
      width: 18px; height: 18px;
      background: #22c55e;
      border: 2px solid var(--primary);
      border-radius: 50%;
    }

    /* Name & Email */
    .user-name {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 6px;
      color: var(--white);
    }

    .user-email {
      color: rgba(255,255,255,0.45);
      font-size: 0.92rem;
      margin-bottom: 28px;
    }

    /* Info Box */
    .info-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 20px 22px;
      text-align: right;
      margin-bottom: 28px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .info-row:last-child { border-bottom: none; padding-bottom: 0; }
    .info-row:first-child { padding-top: 0; }

    .info-icon-wrap {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .icon-green  { background: rgba(34,197,94,0.15);  color: #86efac; }
    .icon-gold   { background: rgba(245,166,35,0.15); color: var(--gold); }
    .icon-blue   { background: rgba(96,165,250,0.15); color: #93c5fd; }

    .info-content { flex: 1; }
    .info-label { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-bottom: 2px; }
    .info-value { font-size: 0.93rem; font-weight: 600; color: var(--white); }

    .badge-active {
      display: inline-block;
      background: rgba(34,197,94,0.15);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 50px;
    }

    .badge-vip {
      display: inline-block;
      background: rgba(245,166,35,0.15);
      border: 1px solid rgba(245,166,35,0.3);
      color: var(--gold-light);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 50px;
    }

    /* Buttons */
    .btn-home {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--white);
      border-radius: 50px;
      padding: 13px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    .btn-home:hover { background: rgba(255,255,255,0.13); color: var(--white); transform: translateY(-2px); }

    .btn-logout {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 50px;
      padding: 13px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover { background: rgba(239,68,68,0.22); border-color: rgba(239,68,68,0.5); transform: translateY(-2px); }

    /* Logo on top */
    .card-logo {
      margin-bottom: 28px;
    }

    .card-logo a {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    /* Toast */
    .toast-wrap { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; }
    .toast-msg { background: rgba(15,12,41,0.95); border: 1px solid rgba(245,166,35,0.4); color: var(--white); padding: 14px 28px; border-radius: 50px; font-size: 0.95rem; font-weight: 500; backdrop-filter: blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); opacity: 0; transform: translateY(20px); transition: all 0.4s ease; white-space: nowrap; }
    .toast-msg.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="glow-orb"></div>

  <div class="profile-card">
    <!-- Logo -->
    <div class="card-logo">
      <a href="index.html">🛍️ مـتجري</a>
    </div>

    <!-- Avatar -->
    <div class="avatar-wrap">
      <div class="avatar-circle">
        <i class="bi bi-person-fill"></i>
      </div>
      <div class="avatar-status"></div>
    </div>

    <!-- Name & Email -->
    <h2 class="user-name" id="uName">جاري التحميل...</h2>
    <p class="user-email" id="uEmail">الرجاء الانتظار</p>

    <!-- Info -->
    <div class="info-box">
      <div class="info-row">
        <div class="info-icon-wrap icon-green"><i class="bi bi-shield-check"></i></div>
        <div class="info-content">
          <p class="info-label">حالة الحساب</p>
          <p class="info-value"><span class="badge-active">نشط وموثق ✓</span></p>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon-wrap icon-gold"><i class="bi bi-star-fill"></i></div>
        <div class="info-content">
          <p class="info-label">نوع العضوية</p>
          <p class="info-value"><span class="badge-vip">⭐ عميل مميز</span></p>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon-wrap icon-blue"><i class="bi bi-calendar3"></i></div>
        <div class="info-content">
          <p class="info-label">عضو منذ</p>
          <p class="info-value" id="joinDate">2025</p>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <a href="index.html" class="btn-home">
      <i class="bi bi-house-door"></i> العودة للمتجر
    </a>
    <button class="btn-logout" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i> تسجيل الخروج
    </button>
  </div>

  <!-- Toast -->
  <div class="toast-wrap">
    <div class="toast-msg" id="toastMsg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlOn_7ErG74KXYhM25LApsZATjXA3PE-M",
      authDomain: "mystore-6fd57.firebaseapp.com",
      projectId: "mystore-6fd57",
      storageBucket: "mystore-6fd57.firebasestorage.app",
      messagingSenderId: "1075846308469",
      appId: "1:1075846308469:web:3d097e4a3064ab33368e3c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('uName').innerText = user.displayName || "مستخدم";
        document.getElementById('uEmail').innerText = user.email;

        // Join date from Firebase metadata
        if (user.metadata?.creationTime) {
          const d = new Date(user.metadata.creationTime);
          document.getElementById('joinDate').innerText =
            d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long' });
        }
      } else {
        window.location.href = 'login.html';
      }
    });

    window.logout = () => {
      showToast('👋 إلى اللقاء!');
      setTimeout(() => {
        signOut(auth).then(() => window.location.href = 'index.html');
      }, 1200);
    };
  </script>
</body>
</html>
