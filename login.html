<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - متجري</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #0f0c29;
      --secondary: #302b63;
      --accent: #24243e;
      --gold: #f5a623;
      --gold-light: #ffd966;
      --white: #ffffff;
      --glass: rgba(255,255,255,0.07);
      --glass-border: rgba(255,255,255,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--primary);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(245,166,35,0.14) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(36,36,62,0.8) 0%, transparent 50%),
        linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      z-index: -2;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, rgba(245,166,35,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      animation: bgMove 20s linear infinite;
    }

    @keyframes bgMove {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* ── Glow orb ── */
    .glow-orb {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245,166,35,0.1) 0%, transparent 65%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    /* ── Card ── */
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: cardIn 0.7s cubic-bezier(.22,1,.36,1) both;
      margin: 20px;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Logo ── */
    .card-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .card-logo a {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .card-logo p {
      color: rgba(255,255,255,0.45);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* ── Heading ── */
    .card-title {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 30px;
      color: var(--white);
    }

    /* ── Form ── */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 13px 44px 13px 16px;
      color: var(--white);
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input::placeholder { color: rgba(255,255,255,0.25); }

    .form-input:focus {
      border-color: rgba(245,166,35,0.55);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(245,166,35,0.12);
    }

    .form-input:focus + .input-icon,
    .input-wrap:focus-within .input-icon {
      color: var(--gold);
    }

    /* ── Submit Button ── */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--primary);
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 24px rgba(245,166,35,0.3);
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(245,166,35,0.5);
    }

    .btn-submit:active { transform: translateY(0); }

    .btn-submit.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    /* ── Error ── */
    .error-msg {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    .error-msg.show { display: block; animation: shake 0.4s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* ── Footer link ── */
    .card-footer-text {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.45);
      font-size: 0.92rem;
    }

    .card-footer-text a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .card-footer-text a:hover { color: var(--gold-light); }

    /* ── Success toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
    }

    .toast-msg {
      background: rgba(15,12,41,0.95);
      border: 1px solid rgba(245,166,35,0.4);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      white-space: nowrap;
    }

    .toast-msg.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="glow-orb"></div>

  <div class="login-card">
    <!-- Logo -->
    <div class="card-logo">
      <a href="index.html">🛍️ مـتجري</a>
      <p>وجهتك الأولى للتسوق</p>
    </div>

    <h2 class="card-title">أهلاً بيك تاني 👋</h2>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">
      <i class="bi bi-exclamation-circle"></i> الإيميل أو الباسورد غلط، حاول تاني
    </div>

    <!-- Form -->
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-wrap">
          <input type="email" id="email" class="form-input" placeholder="example@mail.com" required>
          <i class="bi bi-envelope input-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">كلمة السر</label>
        <div class="input-wrap">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
          <i class="bi bi-lock input-icon"></i>
        </div>
      </div>

      <button class="btn-submit" id="submitBtn" onclick="handleLogin()">
        <i class="bi bi-box-arrow-in-right"></i>
        دخول
      </button>
    </div>

    <p class="card-footer-text">
      مش عندك حساب؟ <a href="register.html">سجّل دلوقتي</a>
    </p>
  </div>

  <!-- Toast -->
  <div class="toast-wrap">
    <div class="toast-msg" id="toastMsg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAlOn_7ErG74KXYhM25LApsZATjXA3PE-M",
      authDomain: "mystore-6fd57.firebaseapp.com",
      projectId: "mystore-6fd57",
      storageBucket: "mystore-6fd57.firebasestorage.app",
      messagingSenderId: "1075846308469",
      appId: "1:1075846308469:web:3d097e4a3064ab33368e3c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    function showToast(msg) {
      const t = document.getElementById('toastMsg');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    window.handleLogin = async () => {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('submitBtn');
      const errBox   = document.getElementById('errorMsg');

      if (!email || !password) return;

      // Loading state
      btn.classList.add('loading');
      btn.innerHTML = '<i class="bi bi-arrow-repeat" style="animation:spin .8s linear infinite"></i> جاري الدخول...';
      errBox.classList.remove('show');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showToast('✅ نورت المتجر!');
        setTimeout(() => window.location.href = 'index.html', 1200);
      } catch (error) {
        btn.classList.remove('loading');
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> دخول';
        errBox.classList.remove('show');
        void errBox.offsetWidth; // reflow for re-animation
        errBox.classList.add('show');
      }
    };

    // Submit on Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.handleLogin();
    });
  </script>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
